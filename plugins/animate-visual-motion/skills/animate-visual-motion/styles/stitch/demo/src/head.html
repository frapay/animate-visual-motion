<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stitch demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #2a1d16; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  STITCH DEMO — 9:16, 6.0s @ 60 BPM (two bars of three, triplet feel), 24fps. Linen in a wooden hoop: a chain-stitch
//  wreath sews itself, a felt heart drops on and a needle sews it down with 22 blanket stitches, one per step; daisies
//  and sequins come out. At 3.0s the heart morphs into a felt house on denim: a cross-stitch border runs round the
//  cloth, a button sun gets its rays, chimney smoke rises in French knots and Beru the felt bear waves.
//  Proves the style kit renders, morphs and stays deterministic.
//  Build: node <skill>/tools/build.mjs <skill>/styles/stitch/demo
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 60, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4, T3 = BEAT / 3, T6 = BEAT / 6, T12 = BEAT / 12;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const CX = 500;

const ERA_LIST = [[0, 3, () => sceneJahit()], [3, 6, () => sceneRumah()]];
const SHOTS = [
  ['jahit', 0, 0.0, 3.0, 'linen in a hoop: a wreath sews itself, a felt heart drops on and a needle blanket-stitches it down'],
  ['rumah', 1, 3.0, 6.0, 'the heart becomes a felt house on denim: cross-stitch border, button sun, the felt bear waves'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [3.0],
  // every cue sits on the 1/12s grid (a 2s step = a triplet 32nd at 60 BPM), so stitches land with the score
  cues: { wreath: -1.0, drop: -2 * T12, sew: 3 * T12, flower: 2 * T3, knots: 1.5, spark: 25 * T12, border: 3.0, bear: 3.5, sun: 3 + 2 * T3, stars: 4.0 },
  acts: [
    { name: '1 Jahit', role: 'build', t0: 0.0, t1: 3.0 },
    { name: '2 Rumah', role: 'gift',  t0: 3.0, t1: 6.0 },
  ],
  board: [
    { t: 1.6, title: 'the needle sews the felt heart down', sound: 'music box waltz, needle ticks', next: 'the heart becomes a house' },
    { t: 5.2, title: 'the felt bear waves by its house', sound: 'the waltz an octave up, twinkles', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
