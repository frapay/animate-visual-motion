<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinetic type demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #141414; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  KINETIC TYPE DEMO — 9:16, 6.0s @ 120 BPM, 24fps. On paper, BELAJAR / LEBIH / CEPAT slam in line by line on the
//  beats while the dot hero hops from word end to word end and becomes the full stop; the words leave, the dot grows
//  and morphs at 3.0s into a square block (circle -> square) that opens onto an ink ground, where a ring fills while "3x" counts up, the hero riding the ring's head;
//  two bars compare 60 vs 20 minutes. Proves the style kit renders, morphs and stays deterministic.
//  Build: node <skill>/tools/build.mjs <skill>/styles/kinetic-type/demo
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const CX = 500;

const ERA_LIST = [[0, 3, () => sceneHook()], [3, 6, () => sceneStat()]];
const SHOTS = [
  ['hook', 0, 0.0, 3.0, 'BELAJAR / LEBIH / CEPAT slam in on the beats; the dot hops along and becomes the full stop'],
  ['stat', 1, 3.0, 6.0, 'the dot becomes a ring that fills while 3x counts up; bars compare 60 vs 20 minutes'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [3.0],
  // every cue sits on the 8th grid (0.25s). Words: the beat they land on (ktWords starts the rise a hair earlier).
  // hop is the take-off: the dot lands 0.34s later, on 5.0.
  cues: { w1: -0.4, w2: 0.5, w3: 1.0, stop: 1.25, ticker: -1, out: 2.0, grow: 2.25, ring: 3.5, full: 4.5, bar1: 4.0, bar2: 4.25, hop: 4.66, land: 5.0 },
  acts: [
    { name: '1 Hook', role: 'build', t0: 0.0, t1: 3.0 },
    { name: '2 Bukti', role: 'gift', t0: 3.0, t1: 6.0 },
  ],
  board: [
    { t: 1.8, title: 'the promise, word by word', sound: 'kick + click per word', next: 'the full stop grows' },
    { t: 5.0, title: 'the proof: 3x', sound: 'ticks, a chime at full', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
