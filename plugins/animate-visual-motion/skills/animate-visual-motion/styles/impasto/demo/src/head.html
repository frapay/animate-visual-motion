<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impasto demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #17130f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  IMPASTO DEMO — 9:16, 6.0s @ 120 BPM, 24fps. A thick oil painting laid on while you watch. Night: a churning
//  ultramarine sky is brushed in round its eddies, a moon is dragged on with the palette knife, stars are dabbed
//  in one by one, a hill, a farmhouse of knife slabs with one lit window, a field in ridged rows, and a small
//  sunflower asleep in the foreground. At 3.0s the moon becomes the sun: the same picture is repainted in
//  daylight, wheat runs to the horizon in chrome yellow, crows cross, and the sunflower opens and turns to the sun.
//  Proves the style kit renders, morphs and stays deterministic.
//  Build: node <skill>/tools/build.mjs <skill>/styles/impasto/demo
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };          // keep content in x 60–940, y 250–1500
const CX = 500;                                               // caption centre (left of the right-hand UI strip)

const ERA_LIST = [[0, 3, () => sceneNight()], [3, 6, () => sceneDay()]];
const SHOTS = [
  ['night', 0, 0.0, 3.0, 'a churning night sky is brushed in, a moon is knifed on, stars are dabbed, a hill, a farmhouse with a lit window, a dark field, a sleeping sunflower'],
  ['day',   1, 3.0, 6.0, 'the moon becomes the sun; the picture is repainted in daylight, wheat in ridged rows, crows, and the sunflower opens and turns to the sun'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [3.0],
  cues: { sky: 0.0, hill: 0.25, moon: 0.5, field: 0.5, stars: 0.75, house: 1.0, flower: 1.0, lamp: 1.75, nod: 2.0, sky2: 3.25, rays: 3.25, field2: 3.5, house2: 3.75, birds: 4.0, wake: 4.0, gust1: 4.75, nod1: 5.0, gust2: 5.25, nod2: 5.5 },
  acts: [
    { name: '1 Night', role: 'build', t0: 0.0, t1: 3.0 },
    { name: '2 Day',   role: 'gift',  t0: 3.0, t1: 6.0 },
  ],
  board: [
    { t: 2.25, title: 'laid on thick, at night', sound: 'a low warm pad, soft brush swishes in streams, a knife scrape for the moon, a small bell for each star', next: 'the moon becomes the sun' },
    { t: 5.25, title: 'repainted in daylight', sound: 'the tune opens to major; brush streams, a gust through the wheat, two crows', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
