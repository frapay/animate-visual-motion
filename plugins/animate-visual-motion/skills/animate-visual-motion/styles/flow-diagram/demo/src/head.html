<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow diagram demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0e13; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  FLOW DIAGRAM DEMO — 9:16, 6.0s @ 120 BPM, 24fps. "Cara pesananmu sampai": on a dotted graphite canvas the flow
//  builds down the frame, Pesan -> Bayar -> the decision "Lunas?", each edge drawing just before its node pops and
//  the packet hero riding it so the node lights when it lands; at 3.0s the decision diamond morphs into a circle
//  (diamond -> circle) that opens onto the branch: "ya" -> Kirim -> Sampai (done tick), "tidak" -> a dimmed retry
//  loop back. Proves the style kit renders, morphs and stays deterministic.
//  Build: node <skill>/tools/build.mjs <skill>/styles/flow-diagram/demo
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const CX = 500;

const ERA_LIST = [[0, 3, () => sceneFlow()], [3, 6, () => sceneBranch()]];
const SHOTS = [
  ['flow', 0, 0.0, 3.0, 'Pesan -> Bayar -> Lunas? builds down the frame; the packet hero rides each edge and lights each node'],
  ['branch', 1, 3.0, 6.0, 'the decision branches: ya -> Kirim -> Sampai (done), tidak -> a dimmed retry loop'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [3.0],
  // every cue sits on the 8th grid (0.25s). eN = an edge starts drawing, nX = a node pops, goN = the hero leaves its
  // node, atN = it lands on the next one (0.5s later) and that node lights.
  cues: { e1: 0.25, n2: 0.5, go1: 0.5, at2: 1.0, e2: 1.25, n3: 1.5, go2: 1.5, at3: 2.0, note: 2.25,
    ya: 3.25, nKirim: 3.5, go3: 3.5, tidak: 3.75, at4: 4.0, nCoba: 4.0, loop: 4.25, e4: 4.25, nSampai: 4.5, go4: 4.5, at5: 5.0, end: 5.25 },
  acts: [
    { name: '1 Alur', role: 'build', t0: 0.0, t1: 3.0 },
    { name: '2 Cabang', role: 'gift', t0: 3.0, t1: 6.0 },
  ],
  board: [
    { t: 1.8, title: 'the flow builds: Pesan, Bayar, Lunas?', sound: 'a tick per edge, a blip per node', next: 'the diamond becomes a lens' },
    { t: 5.4, title: 'the branch: paid means shipped', sound: 'a chime when it arrives', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
