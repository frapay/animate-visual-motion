<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storybook demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #2a2230; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  STORYBOOK DEMO — 9:16, 6.0s @ 120 BPM, 24fps. Night on the hill: the sprout-kid reads under a sleepy moon,
//  fireflies drift, stars twinkle; it looks up, the moon becomes the sun, and morning paints the same hill:
//  birds, a butterfly, chimney smoke, flowers; the kid waves and hops.
//  Proves the style kit renders, morphs and stays deterministic.
//  Build: node <skill>/tools/build.mjs <skill>/styles/storybook/demo
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };          // keep content in x 60–940, y 250–1500
const HAND = '"Chalkboard SE", "Comic Sans MS", "Comic Neue", "Segoe Print", "Arial Rounded MT Bold", "Nunito", cursive';   // rounded hand lettering: macOS, Windows, Linux
const CX = 500;                                               // caption centre (left of the right-hand UI strip)

const ERA_LIST = [[0, 3, () => demoNight()], [3, 6, () => demoMorning()]];
const SHOTS = [
  ['night', 0, 0.0, 3.0, 'the sprout-kid reads under a sleepy moon; fireflies, twinkling stars'],
  ['morning', 1, 3.0, 6.0, 'the moon becomes the sun; morning on the same hill, the kid waves and hops'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [3.0],
  cues: { look: 1.5, rays: 3.4, wave: 3.75, hop1: 4.5, hop2: 5.0 },
  acts: [
    { name: '1 Night', role: 'build', t0: 0.0, t1: 3.0 },
    { name: '2 Morning', role: 'gift', t0: 3.0, t1: 6.0 },
  ],
  board: [
    { t: 1.25, title: 'reading under the moon', sound: 'soft pad, a music-box pluck', next: 'the kid looks up' },
    { t: 5.0, title: 'good morning on the hill', sound: 'warm pad, plucks on the hops, bird blips', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
