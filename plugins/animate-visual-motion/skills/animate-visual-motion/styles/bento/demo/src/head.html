<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bento demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0d; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  BENTO DEMO — 9:16, 6.0s @ 120 BPM, 24fps. A launch board for an invented, unnamed pocket speaker.
//  Era 1 (dark ground): the feature board assembles tile by tile round the gradient hero tile with the product
//  mark: a toggle flips, bars grow, a numeral counts, pictograms draw on, a level meter dances, the swatch ring
//  slides to the accent finish, a ring fills. At 3.0s the board closes onto the hero tile, which widens into the
//  one tinted tile of era 2 (light ground): 48 h of battery counts up, the other tiles pop in, then the whole grid
//  re-flows so the headline takes the top of the board, and "low power" switches on.
//  Proves the style kit renders, morphs and stays deterministic.
//  Build: node <skill>/tools/build.mjs <skill>/styles/bento/demo
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };          // keep content in x 60–940, y 250–1500
const CX = 500;                                               // caption centre (left of the right-hand UI strip)

const ERA_LIST = [[0, 3, () => sceneBoard()], [3, 6, () => sceneBattery()]];
const SHOTS = [
  ['board',   0, 0.0, 3.0, 'a dark feature board assembles tile by tile round the hero tile: toggle, bars, numerals, pictograms, a level meter, swatches, a ring'],
  ['battery', 1, 3.0, 6.0, 'the hero tile widens into the tinted headline tile on a light board: 48 h counts up, tiles pop in, the grid re-flows, low power switches on'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [3.0],
  cues: { hero: 0.0, tiles: 0.125, flip: 1.75, pick: 2.0, press: 2.25, morph: 3.0, count: 3.375, tiles2: 3.375, reflow: 4.75, saver: 5.25, badge: 5.5 },
  acts: [
    { name: '1 Board',   role: 'build', t0: 0.0, t1: 3.0 },
    { name: '2 Battery', role: 'gift',  t0: 3.0, t1: 6.0 },
  ],
  board: [
    { t: 2.0, title: 'everything on one board', sound: 'a clean pluck pattern in A, a soft pop per tile climbing a scale, a switch click', next: 'the board closes onto the hero tile, which widens' },
    { t: 5.0, title: 'the headline number', sound: 'the chord lifts to D, ticks as the number counts, a swoosh as the grid re-flows, a last chime', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
