<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Nouveau demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #2a2418; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  ART NOUVEAU DEMO — 9:16, 6.0s @ 120 BPM, 24fps. A lithographic poster draws itself: the border climbs from the
//  bottom corners and meets at the top, a rose halo fills ring by ring, a lily stem grows up a whiplash curve and
//  opens petal by petal while a dragonfly arrives. The lily folds away and at 3.0s the rose halo becomes a gold
//  one: a mosaic sets itself round it, an iris rises and opens, peacock feathers unfurl, ginkgo leaves drift down.
//  Proves the style kit renders, morphs and stays deterministic.
//  Build: node <skill>/tools/build.mjs <skill>/styles/art-nouveau/demo
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };          // keep what matters in x 60–940, y 250–1500
const CX = 540;                                               // the poster's axis

const ERA_LIST = [[0, 3, () => sceneLily()], [3, 6, () => sceneIris()]];
const SHOTS = [
  ['lily', 0, 0.0, 3.0, 'the border draws itself, a rose halo fills ring by ring, a lily grows and opens, a dragonfly arrives; the lily folds away'],
  ['iris', 1, 3.0, 6.0, 'the halo turns gold and sets its mosaic; an iris rises and opens, peacock feathers unfurl, ginkgo leaves drift down'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [3.0],
  cues: { border: 0.0, rings: 0.3, stem: 0.2, fly: 0.75, bloom: 0.95, fold: 2.3, rings2: 3.25, stem2: 3.25, feather: 3.5, bloom2: 4.0, swoop: 4.75, leaves: 3.6 },
  acts: [
    { name: '1 Lily', role: 'build', t0: 0.0, t1: 3.0 },
    { name: '2 Iris', role: 'gift',  t0: 3.0, t1: 6.0 },
  ],
  board: [
    { t: 2.0, title: 'a lily opens', sound: 'a slow harp, a soft flute note as each petal opens', next: 'the rose halo turns gold' },
    { t: 5.25, title: 'an iris in gold', sound: 'the harp widens; glassy ticks as the mosaic sets', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
