<title>Sand demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #150b05; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  SAND DEMO — 9:16, 6.0s @ 120 BPM, 24fps. On a backlit glass table the last picture is swept away; sand pours from
//  the top and piles into two dunes, a palm is dribbled on, a round sun is rubbed clean in the hazy sky and Unta, a
//  small camel made of sand, walks the ridge toward it. At 3.0s the sun is rubbed into a full moon: the lamp cools,
//  stars are poked out one by one, a mosque's windows and a tent's lamp light up, and Unta lies down to sleep.
//  Proves the style kit renders, morphs and stays deterministic.
//  Build: node <skill>/tools/build.mjs <skill>/styles/sand/demo
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };          // keep content in x 60–940, y 250–1500
const CX = 500;                                               // caption centre (left of the right-hand UI strip)

const ERA_LIST = [[0, 3, () => sceneGurun()], [3, 6, () => sceneMalam()]];
const SHOTS = [
  ['gurun', 0, 0.0, 3.0, 'the table is swept; sand pours into dunes, a palm, a wiped sun; the camel walks the ridge'],
  ['malam', 1, 3.0, 6.0, 'the sun is rubbed into a full moon; stars are poked out, lamps light up, the camel lies down'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [3.0],
  cues: { sweep: 0.0, pour1: 0.25, pour2: 0.5, palm: 1.0, sun: 1.25, bird: 1.5, look: 2.25,
    star: 3.75, win: 4.0, sit: 4.5, lamp: 4.75, sleep: 5.25, shoot: 5.5 },
  acts: [
    { name: '1 Gurun', role: 'build', t0: 0.0, t1: 3.0 },
    { name: '2 Malam', role: 'gift',  t0: 3.0, t1: 6.0 },
  ],
  board: [
    { t: 2.2, title: 'a long walk in the desert', sound: 'warm drone, plucked tune, sand hiss and a finger swish', next: 'the sun is rubbed into the moon' },
    { t: 5.6, title: 'rest under the stars', sound: 'cool pad, soft bells for the stars', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
