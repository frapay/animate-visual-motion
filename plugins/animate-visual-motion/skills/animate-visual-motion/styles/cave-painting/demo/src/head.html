<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cave painting demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0806; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  CAVE PAINTING DEMO — 9:16, 6.0s @ 120 BPM, 24fps. A limestone wall by torchlight. A red disc is rubbed on, a
//  bison, a horse and a small red stag are daubed line by line, two stick hunters run in, a spear flies.
//  At 3.0s the light closes onto the disc; in the dark it is blown over into the halo of a hand stencil; the
//  hand is lifted and the light opens on a wall of hands, a babirusa and an anoa (Sulawesi), the stag still there.
//  Proves the style kit renders, morphs and stays deterministic.
//  Build: node <skill>/tools/build.mjs <skill>/styles/cave-painting/demo
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };          // keep content in x 60–940, y 250–1500
const CX = 500;                                               // caption centre (left of the right-hand UI strip)

const ERA_LIST = [[0, 3, () => sceneHunt()], [3, 6, () => sceneHands()]];
const SHOTS = [
  ['hunt',  0, 0.0, 3.0, 'a red disc, a bison, a horse and a red stag are daubed on the rock; two hunters run in and a spear flies'],
  ['hands', 1, 3.0, 6.0, 'the disc is blown over into a hand stencil; more hands, a babirusa and an anoa appear; the stag walks in the flicker'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [3.0],
  cues: { disc: 0.0, bison: 0.2, horse: 0.75, stag: 1.0, hunters: 1.5, dots: 1.75, spear: 2.0, lift: 3.2, hand1: 3.5, pig: 3.6, hand2: 4.0, hand3: 4.5, anoa: 4.5, dots2: 5.0 },
  acts: [
    { name: '1 Hunt',  role: 'build', t0: 0.0, t1: 3.0 },
    { name: '2 Hands', role: 'gift',  t0: 3.0, t1: 6.0 },
  ],
  board: [
    { t: 2.25, title: 'the hunt, daubed by firelight', sound: 'a low skin drum, a breath, dry finger scrapes, fire crackle', next: 'the red disc becomes a hand' },
    { t: 5.25, title: 'we were here', sound: 'the drum doubles, a bone flute, breaths of blown pigment', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
