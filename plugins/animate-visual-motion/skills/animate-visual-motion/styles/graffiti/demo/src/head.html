<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graffiti demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #141216; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  GRAFFITI DEMO — 9:16, 6.0s @ 80 BPM (two bars), 24fps. A brick wall under a flickering street light: a round
//  yellow blob is sprayed on and starts to run; Kaleng, the spray-can hero, is stencilled on in three layers (cyan
//  base, black shadows, white highlights); he presses his nozzle and the bubble word PAINT pops on letter by letter,
//  then a lime fat-cap underline. At 3.0s the yellow blob becomes a pink blob on a concrete wall: a wire is sprayed
//  under it, a stencil bird lands on it in three layers, FLY pops on, sprayed dots pop, the bird hops.
//  Proves the style kit renders, morphs and stays deterministic.
//  Build: node <skill>/tools/build.mjs <skill>/styles/graffiti/demo
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 80, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };          // keep content in x 60–940, y 250–1500
const CX = 500;                                               // caption centre (left of the right-hand UI strip)

const ERA_LIST = [[0, 3, () => sceneBrick()], [3, 6, () => sceneConcrete()]];
const SHOTS = [
  ['brick',    0, 0.0, 3.0, 'a yellow blob is sprayed on a brick wall and runs; the can hero is stencilled on in three layers; PAINT pops on; a lime underline'],
  ['concrete', 1, 3.0, 6.0, 'the blob turns pink on concrete; a wire, a three-layer stencil bird, FLY pops on, dots pop, the bird hops'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [3.0],
  cues: { blob: 0.0, s1: 0.375, s2: 0.75, s3: 1.125, w1: 1.5, line: 2.0, wire: 3.5625, b1: 3.75, b2: 4.125, b3: 4.5, f1: 4.875, hop: 5.25, d1: 5.4375, d2: 5.625 },
  acts: [
    { name: '1 Brick',    role: 'build', t0: 0.0, t1: 3.0 },
    { name: '2 Concrete', role: 'gift',  t0: 3.0, t1: 6.0 },
  ],
  board: [
    { t: 2.3, title: 'a wall gets its first piece', sound: 'boom-bap; can hiss, card slaps, letter pops', next: 'the yellow blob turns pink' },
    { t: 5.6, title: 'a bird on a wire, and it can fly', sound: 'the beat lifts to F; hiss, slaps, pops, a chirp', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
