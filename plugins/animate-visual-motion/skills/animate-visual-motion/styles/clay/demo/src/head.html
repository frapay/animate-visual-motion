<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clay demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #2e1a1e; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  CLAY DEMO — 9:16, 6.0s @ 120 BPM, 24fps. On a small studio set a brown ball of clay (a seed) drops onto the
//  table; Bulat, the round red hero, hops in and pushes it, and the seed jumps on its own. At 3.0s the seed is
//  squashed and re-shaped into the crown of a clay tree: fruit pops out, one drops and bounces, Bulat cheers and hops.
//  Proves the style kit renders, morphs and stays deterministic.
//  Build: node <skill>/tools/build.mjs <skill>/styles/clay/demo
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };          // keep content in x 60–940, y 250–1500
const CX = 500;                                               // caption centre (left of the right-hand UI strip)

const ERA_LIST = [[0, 3, () => sceneBiji()], [3, 6, () => scenePohon()]];
const SHOTS = [
  ['biji',  0, 0.0, 3.0, 'a seed of clay drops onto the table; the hero hops in and pushes it; the seed jumps'],
  ['pohon', 1, 3.0, 6.0, 'the seed is re-shaped into a tree crown; fruit pops out, one drops; the hero cheers and hops'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [3.0],
  cues: { land: 0.5, hopin: 0.75, pat: 1.5, jump: 2.0, cheer: 3.75, f1: 4.0, f2: 4.25, f3: 4.5, drop: 4.75, bounce: 5.0, hop2: 5.5 },
  acts: [
    { name: '1 Biji',  role: 'build', t0: 0.0, t1: 3.0 },
    { name: '2 Pohon', role: 'gift',  t0: 3.0, t1: 6.0 },
  ],
  board: [
    { t: 1.5, title: 'a small seed', sound: 'soft pad, wood plucks, a thud and a push', next: 'the seed is re-shaped into a tree' },
    { t: 5.0, title: 'it grew into a tree', sound: 'warm pad, plucks, pops for the fruit', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
