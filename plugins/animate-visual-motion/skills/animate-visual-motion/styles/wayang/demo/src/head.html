<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayang demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #120603; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  WAYANG DEMO — 9:16, 6.0s @ 120 BPM, 24fps. On the lamp-lit screen the gunungan stands centre, spins about its
//  rod and steps aside while a young villager puppet walks in and presents it; at 3.0s the gunungan becomes a
//  mountain: a village at its foot (trees, a joglo house, birds), the puppet walks in again and waves.
//  Build: node <skill>/tools/build.mjs <skill>/styles/wayang/demo
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const CX = 540;

const ERA_LIST = [[0, 3, () => sceneOpen()], [3, 6, () => sceneVillage()]];
const SHOTS = [
  ['open',    0, 0.0, 3.0, 'the gunungan spins on its rod and steps aside; a puppet walks in and presents it'],
  ['village', 1, 3.0, 6.0, 'the gunungan becomes a mountain; trees, a house and birds; the puppet walks in and waves'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [3.0],
  cues: { spin: 0.2, aside: 1.4, walk: 1.0, stop: 2.0, present: 2.0, trees: 3.3, house: 3.55, birds: 3.4, walk2: 3.7, stop2: 5.0, wave: 5.1 },
  acts: [
    { name: '1 Pembuka', role: 'build', t0: 0.0, t1: 3.0 },
    { name: '2 Desa',    role: 'gift',  t0: 3.0, t1: 6.0 },
  ],
  board: [
    { t: 2.6, title: 'the puppet presents the gunungan', sound: 'saron, kenong, a kendang roll', next: 'the gunungan becomes a mountain' },
    { t: 5.4, title: 'the village at the foot of the mountain', sound: 'a gong, bonang', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
