<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosaic demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #261c18; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  MOSAIC DEMO — 9:16, 6.0s @ 120 BPM, 24fps. Inside a meander border a sea of teal fan-pattern tiles is laid over
//  the mortar; waves, seaweed and a scallop shell with a pearl are laid in; Sisik, the little terracotta fish,
//  swims up and nudges the pearl, which rises out of the shell. At 3.0s the pearl is re-laid as a golden sun
//  medallion over a tiled garden: its rays are laid one by one, fruit ripens on the tree, and Sisik leaps out of
//  the pond. Proves the style kit renders, morphs and stays deterministic.
//  Build: node <skill>/tools/build.mjs <skill>/styles/mosaic/demo
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };          // keep content in x 60–940, y 250–1500
const CX = 500;                                               // caption centre (left of the right-hand UI strip)

const ERA_LIST = [[0, 3, () => sceneLaut()], [3, 6, () => sceneMatahari()]];
const SHOTS = [
  ['laut',     0, 0.0, 3.0, 'a sea of fan-pattern tiles is laid; waves, a shell and a pearl; the fish nudges the pearl and it rises'],
  ['matahari', 1, 3.0, 6.0, 'the pearl is re-laid as a sun medallion over a garden; rays and fruit are laid; the fish leaps from the pond'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [3.0],
  cues: { sea: 0.0, waves: 0.75, shell: 0.75, pearl: 1.25, swim: 1.0, nudge: 2.0, rays: 3.75, f1: 4.0, f2: 4.25, f3: 4.5, leap: 4.75, splash: 5.25, leap2: 5.5, splash2: 5.875 },
  acts: [
    { name: '1 Laut',     role: 'build', t0: 0.0, t1: 3.0 },
    { name: '2 Matahari', role: 'gift',  t0: 3.0, t1: 6.0 },
  ],
  board: [
    { t: 1.75, title: 'a pearl in the sea', sound: 'soft pad, plucked strings, a stream of tile clicks', next: 'the pearl is re-laid as the sun' },
    { t: 5.0, title: 'it shines like the sun', sound: 'bright pad, plucks, clicks for the rays, a splash', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
