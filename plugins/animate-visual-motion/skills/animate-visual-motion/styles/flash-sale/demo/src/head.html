<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flash-sale demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a0010; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  FLASH-SALE DEMO — 9:16, 6.0s @ 120 BPM, 24fps. A sale ad for an invented, unbranded shop and product.
//  Era 1, the teaser (red to orange): FLASH / SALE slam in, the bolt mascot pops beside them, a -70% starburst
//  counts up, a voucher ticket lands and a flip-digit countdown ticks. At 3.0s the bolt becomes the product card
//  (magenta to violet): a sneaker pictogram, stars, the old price is struck and the new one drops, the stock bar
//  fills, a price tag swings on its string, and a pulsing CTA is tapped twice. Rays turn, confetti and coins fall,
//  sparkles twinkle. All copy and the currency are the piece's own (the kit hardcodes none).
//  Proves the style kit renders, morphs and stays deterministic.
//  Build: node <skill>/tools/build.mjs <skill>/styles/flash-sale/demo
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };          // keep content in x 60–940, y 250–1500
const CX = 500;                                               // caption centre (left of the right-hand UI strip)
const HAND = '"Helvetica Neue", "Segoe UI", Arial, sans-serif';   // the storyboard sheet's title font (kit/board.js)

const ERA_LIST = [[0, 3, () => sceneTeaser()], [3, 6, () => sceneProduct()]];
const SHOTS = [
  ['teaser', 0, 0.0, 3.0, 'FLASH / SALE slam in on a red-orange ray ground; the bolt mascot pops; a -70% starburst counts up, a voucher ticket lands, the flip countdown ticks'],
  ['product', 1, 3.0, 6.0, 'the bolt becomes the product card on magenta-violet: the old price is struck and the new one drops, the stock bar fills, a tag swings, the CTA pulses and is tapped'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [3.0],
  cues: { flash: 0.0, sale: 0.25, zap: 0.5, timer: 0.75, badge: 1.0, count: 1.5, coupon: 1.5, cap1: 1.75, tick2: 2.0, morph: 3.0,
          tag: 3.5, badge2: 3.75, price: 4.0, ship: 4.25, stock: 4.25, cta: 4.5, land: 4.75, tap1: 5.0, tap2: 5.5 },
  acts: [
    { name: '1 The teaser', role: 'build', t0: 0.0, t1: 3.0 },
    { name: '2 The deal', role: 'gift', t0: 3.0, t1: 6.0 },
  ],
  board: [
    { t: 2.25, title: 'flash sale', sound: 'four-on-the-floor kick, claps, a bright bass riff; a thud per slam, a pop per badge, a tick per second', next: 'the bolt becomes the product card' },
    { t: 5.0, title: 'the price drops', sound: 'the riff lifts; a falling run as the price drops, a cash-register chime when it lands, two taps', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
