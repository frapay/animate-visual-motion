<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flat vector demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #10132f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  FLAT VECTOR DEMO — 9:16, 6.0s @ 120 BPM, 24fps. On a cream ground a light bulb pops in and switches on
//  while the mascot (there from the first frame) hops; its glass morphs at 3.0s into a turning globe on a navy ground, ringed by an orbit of
//  icons, with a counter ticking up. Proves the style kit renders, morphs and stays deterministic.
//  Build: node <skill>/tools/build.mjs <skill>/styles/flat-vector/demo
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const CX = 500;

const ERA_LIST = [[0, 3, () => sceneIdea()], [3, 6, () => sceneWorld()]];
const SHOTS = [
  ['idea',  0, 0.0, 3.0, 'a light bulb pops in and switches on; the mascot hops; a chart ticks'],
  ['world', 1, 3.0, 6.0, 'the glass becomes a turning globe; icons orbit; a counter ticks up'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [3.0],
  // every cue sits on the 16th grid (0.125s = 3 frames at 24fps, 120 BPM); the big ones on beats
  cues: { bulb: 0.125, card: 0.5, on: 1.0, badge: 1.25, chat: 1.5, hero2: 3.5, orbit: 3.5, icons: 3.625, notif: 4.0, hop2: 4.5 },
  acts: [
    { name: '1 Ide',   role: 'build', t0: 0.0, t1: 3.0 },
    { name: '2 Dunia', role: 'gift',  t0: 3.0, t1: 6.0 },
  ],
  board: [
    { t: 2.2, title: 'the bulb is lit', sound: 'a light chime, off-beat plucks', next: 'the glass becomes a globe' },
    { t: 5.2, title: 'the idea goes global', sound: 'the payoff stab + sub at 3.0, then a full groove', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
